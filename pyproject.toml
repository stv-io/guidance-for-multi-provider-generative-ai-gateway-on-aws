# Developer tooling for the repo root: the integration tests in tests/, the
# benchmark in scripts/, and the two test-middleware-*.py smoke scripts.
# This is NOT the middleware image; that is middleware/pyproject.toml, a
# separate uv project with its own lockfile.
#
#   uv sync                                   # create .venv from uv.lock
#   uv run pytest tests/openai_chat_test_file.py
#   uv run python scripts/benchmark.py
#   uv run python test-middleware-streaming.py
#
# See "Running the tests and scripts" in README.md for the env vars.

[project]
name = "llm-gateway-dev-tools"
version = "0.1.0"
readme = false
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
# Integration tests (tests/) and the root test-middleware-*.py scripts.
tests = [
    "aiohttp",
    "boto3",
    "locust",
    "openai",
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "requests",
]
# scripts/benchmark.py
scripts = [
    "click",
    "litellm>=1.83.7",
    "python-dotenv",
    "tabulate",
    "termcolor",
    "tqdm",
]
dev = ["ruff>=0.17.1"]

[tool.uv]
package = false
default-groups = ["tests", "scripts", "dev"]

[tool.ruff]
target-version = "py314"
line-length = 88
# middleware/ has its own [tool.ruff] in middleware/pyproject.toml, which
# takes precedence for files under it.
#
# Not yet ruff-clean (pre-existing lint/format findings). Listed here so
# `ruff check .` and the pre-commit hooks pass without reformatting them in
# bulk; remove an entry once that file has been cleaned up.
extend-exclude = [
    "tests/bedrock_chat_test_file.py",
    "tests/management_apis_test_file.py",
    "tests/openai_chat_test_file.py",
    "scripts/benchmark.py",
    "test-middleware-streaming.py",
    "test-middleware-synchronous.py",
    "litellm-fake-llm-load-testing-server-terraform/docker/fake_llm_server.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
